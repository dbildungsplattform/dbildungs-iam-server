# Temporarily deactivated due to missing SonarCloud instance
sonar.organization=dbildungsplattform
sonar.projectKey=dBildungsplattform_dbildungs-iam-server
# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=dbildungs-iam-server
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts
sonar.test.exclusions=**/node_modules/**
sonar.exclusions=**/lcov-report/**
# Mirror the vitest coverage scope (include src/**/*.ts, minus the excludes in vite.config.ts)
# so SonarCloud reports the same coverage the test run measured.
sonar.coverage.exclusions=**/main.ts,**/index.ts,**/*.module.ts,**/*.types.ts,**/*.d.ts,**/*.spec.ts,**/*.integration-spec.ts,test/**,test-migrations/**,migrations/**,charts/dbildungs-iam-server/migrations/**,seeding/**,eslint.config.ts,vite.config.ts

# Coverage threshold levels are enforced by the SonarCloud Quality Gate (project settings), not this file.
# Location for the coverage report files
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
