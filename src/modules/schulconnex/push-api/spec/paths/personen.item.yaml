parameters:
    - $ref: ../components/parameters/person-id.yaml
patch:
    tags:
        - Personen
    operationId: updatePerson
    summary: Person aktualisieren
    description: Aktualisiert änderbare Daten einer bestehenden Person.
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: ../components/schemas/person-update-payload.yaml
    responses:
        '202':
            description: Anfrage zur Aktualisierung einer Person wurde akzeptiert.
        '400':
            description: Übermittelter Request-Body ist ungültig.
            content:
                application/json:
                    schema:
                        $ref: ../components/schemas/error-response.yaml
delete:
    tags:
        - Personen
    operationId: deletePerson
    summary: Person löschen
    description: Löscht eine Person im Zielsystem.
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: ../components/schemas/person-delete-payload.yaml
    responses:
        '202':
            description: Anfrage zum Löschen einer Person wurde akzeptiert.
        '400':
            description: Übermittelter Request-Body ist ungültig.
            content:
                application/json:
                    schema:
                        $ref: ../components/schemas/error-response.yaml
