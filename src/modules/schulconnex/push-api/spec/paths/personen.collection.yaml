post:
    tags:
        - Personen
    operationId: createPerson
    summary: Person anlegen
    description: Legt einen Personendatensatz im Zielsystem an.
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: ../components/schemas/person-create-payload.yaml
    responses:
        '202':
            description: Anfrage zum Anlegen einer Person wurde akzeptiert.
        '400':
            description: Übermittelter Request-Body ist ungültig.
            content:
                application/json:
                    schema:
                        $ref: ../components/schemas/error-response.yaml
